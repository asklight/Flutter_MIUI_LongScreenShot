name: miui_long_screenshot
description: MIUI system long screenshot support for Flutter vertical scroll views.
version: 0.1.0
repository: https://github.com/steven12138/Flutter_MIUI_LongScreenShot
issue_tracker: https://github.com/steven12138/Flutter_MIUI_LongScreenShot/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.steven12138.miui_long_screenshot
        pluginClass: MiuiLongScreenshotPlugin
